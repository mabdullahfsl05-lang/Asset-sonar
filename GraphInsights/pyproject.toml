[project]
name = "machinerec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
machinerec = "machinerec:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
